  <!-- Decap CMS will automatically mount itself into the body of the document -->
  
  <script>
    // Instead of using a config.yml file, we can initialize Decap CMS manually
    // via JavaScript. This allows us to keep everything in one file for testing.
    CMS.init({
      config: {
        // Connect to your actual GitHub repository
        backend: {
          name: 'github',
          repo: 'romance/ElOpioDelSur', // e.g., 'torvalds/my-blog'
          branch: 'main', // The branch you want to publish to
          base_url: 'https://api.netlify.com', // Free auth bridge
          site_domain: 'api.netlify.com' 
        },
        
        // These folders are required by the CMS configuration for media uploads
        media_folder: 'assets/images',
        public_folder: '/assets/images',

        // Collections define the different types of content your friends can write.
        collections: [
          {
            name: 'articles',
            label: 'Articles',
            folder: '_articles', // In a real repo, files would be saved here
            create: true, // Allows users to create new articles
            slug: '{{year}}-{{month}}-{{day}}-{{slug}}', // How the file name is generated
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Publish Date', name: 'date', widget: 'datetime' },
              { label: 'Body', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      }
